[project]
name = "sentinel-science"
version = "0.1.0"
description = "Models and data pipelines for Sentinel ER"
requires-python = ">=3.12,<3.13"
dependencies = [
    "lightgbm",
    "pandas",
    "numpy",
    "scikit-learn",
    "matplotlib",
    "requests",
    "openpyxl",
    "fastapi>=0.141.1",
    "uvicorn>=0.53.0",
    "statsmodels>=0.15.0",
    "xarray>=2026.7.0",
    "cfgrib>=0.9.15.1",
    "eccodes>=2.48.0",
    "herbie-data>=2026.9.0",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["ml"]
